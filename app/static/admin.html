<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Restricted</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(180, 40, 40, 0.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 80%, rgba(100, 20, 20, 0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
    }

    /* Lock icon */
    .icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      border-radius: 50%;
      background: rgba(200, 50, 50, 0.08);
      border: 1px solid rgba(200, 50, 50, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 3s ease-in-out infinite;
    }

    .icon-wrap svg {
      width: 36px;
      height: 36px;
      color: #c84040;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(200, 50, 50, 0); }
      50%       { box-shadow: 0 0 0 12px rgba(200, 50, 50, 0.06); }
    }

    /* Divider line */
    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200, 50, 50, 0.5), transparent);
      margin: 0 auto 2rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f0f0f0;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      line-height: 1.2;
    }

    h1 span {
      color: #c84040;
    }

    p {
      font-size: 0.95rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.35);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <div class="divider"></div>

    <h1>Free Trial <span>Ended</span></h1>
    <p>This area is no longer accessible.</p>
  </div>
</body>
</html>
