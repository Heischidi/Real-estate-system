version: "3.9"

# ============================================================================
# Nigerian Real Estate Alert Platform — Docker Compose
# Services: api, postgres, redis, celery, celery-beat, nginx, telegram-bot
# ============================================================================

x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  SECRET_KEY: ${SECRET_KEY}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  ADMIN_USERNAME: ${ADMIN_USERNAME}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  APP_ENV: ${APP_ENV:-production}
  SCRAPER_REQUEST_DELAY_SECONDS: ${SCRAPER_REQUEST_DELAY_SECONDS:-5.0}
  SCRAPE_INTERVAL_MINUTES: ${SCRAPE_INTERVAL_MINUTES:-15}
  PLAYWRIGHT_HEADLESS: "true"
  METRICS_ENABLED: ${METRICS_ENABLED:-true}

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: realestate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realestate}
      POSTGRES_USER: ${POSTGRES_USER:-realestate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-realestate_user} -d ${POSTGRES_DB:-realestate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realestate_net

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: realestate_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realestate_net

  # ---------------------------------------------------------------------------
  # Database Migration (runs once, then exits)
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: realestate_migrate
    command: alembic upgrade head
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - realestate_net
    restart: "no"

  # ---------------------------------------------------------------------------
  # FastAPI Application
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: realestate_api
    restart: unless-stopped
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - realestate_net

  # ---------------------------------------------------------------------------
  # Celery Worker (scraping + alerts)
  # ---------------------------------------------------------------------------
  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: realestate_celery
    command: >
      celery -A app.tasks.celery_app.celery_app worker
      --loglevel=info
      --queues=scraping,alerts,default
      --concurrency=2
      --max-tasks-per-child=50
    restart: unless-stopped
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - playwright_cache:/root/.cache/ms-playwright
    networks:
      - realestate_net

  # ---------------------------------------------------------------------------
  # Celery Beat (scheduler)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: realestate_celery_beat
    command: >
      celery -A app.tasks.celery_app.celery_app beat
      --loglevel=info
      --scheduler=celery.beat.PersistentScheduler
    restart: unless-stopped
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - realestate_net

  # ---------------------------------------------------------------------------
  # Telegram Bot
  # ---------------------------------------------------------------------------
  telegram-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    container_name: realestate_telegram_bot
    restart: unless-stopped
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - realestate_net

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: realestate_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - realestate_net

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
  playwright_cache:

networks:
  realestate_net:
    driver: bridge
