# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC
truncate_slug_length = 40
revision_environment = false
sourceless = false
version_locations = %(here)s/alembic/versions
version_path_separator = os

# Database URL — override via ALEMBIC_DATABASE_URL env var or set here
# Leave as env var reference; alembic/env.py reads it from settings
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# hooks = black, ruff
# black.type = console_scripts
# black.entrypoint = black
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = --fix

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
